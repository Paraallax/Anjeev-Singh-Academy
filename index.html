<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LabChat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         PDF VIEWER
         This is the initial/full-screen application.
    ====================================================== -->

    <section
        id="pdfViewerScreen"
        class="pdf-viewer-screen"
    >


        <!-- ================================================
             PDF VIEWER TOOLBAR
        ================================================= -->

        <header class="pdf-toolbar">


            <!-- LEFT -->

            <div class="pdf-toolbar-left">

                <button
                    id="pdfPreviousButton"
                    class="pdf-toolbar-button"
                    type="button"
                    title="Previous page"
                    aria-label="Previous page"
                >
                    ‹
                </button>


                <span
                    id="pdfPageNumber"
                    class="pdf-page-number"
                >
                    1 / 1
                </span>


                <button
                    id="pdfNextButton"
                    class="pdf-toolbar-button"
                    type="button"
                    title="Next page"
                    aria-label="Next page"
                >
                    ›
                </button>

            </div>



            <!-- CENTER -->

            <div class="pdf-toolbar-center">

                <span
                    id="pdfDocumentTitle"
                    class="pdf-document-title"
                >
                    Lab Document
                </span>

            </div>



            <!-- RIGHT -->

            <div class="pdf-toolbar-right">


                <button
                    id="pdfZoomOutButton"
                    class="pdf-toolbar-button"
                    type="button"
                    title="Zoom out"
                    aria-label="Zoom out"
                >
                    −
                </button>


                <span
                    id="pdfZoomValue"
                    class="pdf-zoom-value"
                >
                    100%
                </span>


                <button
                    id="pdfZoomInButton"
                    class="pdf-toolbar-button"
                    type="button"
                    title="Zoom in"
                    aria-label="Zoom in"
                >
                    +
                </button>


                <button
                    id="pdfFitButton"
                    class="pdf-toolbar-button"
                    type="button"
                    title="Fit page"
                    aria-label="Fit page"
                >
                    ⛶
                </button>

            </div>


        </header>



        <!-- ================================================
             PDF VIEWPORT
        ================================================= -->

        <main
            id="pdfViewport"
            class="pdf-viewport"
        >

            <div
                id="pdfPages"
                class="pdf-pages"
            >

                <!--
                    PDF.js will create the pages here.
                -->

            </div>


            <!-- PDF LOADING -->

            <div
                id="pdfLoading"
                class="pdf-loading"
            >

                <div class="pdf-loading-spinner"></div>

                <span>
                    Loading document...
                </span>

            </div>


            <!-- PDF ERROR -->

            <div
                id="pdfError"
                class="pdf-error hidden"
            >

                <strong>
                    Unable to load the document
                </strong>

                <span id="pdfErrorMessage">
                    Please try again.
                </span>

            </div>

        </main>


    </section>



    <!-- =====================================================
         LOGIN OVERLAY

         Opens ONLY with:
         Ctrl + Shift + L

         No shortcut text is displayed here.
    ====================================================== -->

    <div
        id="loginOverlay"
        class="login-overlay hidden"
    >


        <div
            id="loginModal"
            class="login-modal"
        >


            <!-- CLOSE -->

            <button
                id="closeLoginButton"
                class="login-close"
                type="button"
                aria-label="Close login"
            >
                ×
            </button>



            <!-- LOGO -->

            <div class="login-logo">
                LC
            </div>



            <h1>
                LabChat Login
            </h1>


            <p class="login-subtitle">
                Sign in to continue
            </p>



            <!-- LOGIN FORM -->

            <form
                id="loginForm"
            >


                <!-- EMAIL / ID -->

                <div class="login-field">

                    <label
                        for="loginIdentifier"
                    >
                        Email / ID
                    </label>


                    <input
                        id="loginIdentifier"
                        type="text"
                        placeholder="Enter your email or ID"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="login-field">

                    <label
                        for="loginPassword"
                    >
                        Password
                    </label>


                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- ERROR -->

                <p
                    id="loginError"
                    class="login-error"
                ></p>



                <!-- LOGIN -->

                <button
                    id="loginButton"
                    class="login-submit"
                    type="submit"
                >
                    Login
                </button>


            </form>


        </div>


    </div>



    <!-- =====================================================
         LABCHAT APPLICATION

         Hidden initially.

         It will become visible after successful
         Supabase authentication.
    ====================================================== -->

    <section
        id="chatScreen"
        class="chat-screen hidden"
    >


        <!-- =================================================
             CHAT TOPBAR
        ================================================== -->

        <header class="topbar">


            <div class="brand">

                <div class="small-logo">
                    LC
                </div>

                <div>

                    <h2>
                        LabChat
                    </h2>

                    <span id="connectionStatus">
                        Connecting...
                    </span>

                </div>

            </div>



            <!-- ONLINE -->

            <div class="online-info">

                <span class="online-dot"></span>

                <span id="onlineCount">
                    0 online
                </span>

            </div>



            <!-- USER -->

            <div class="user-info">

                <span id="currentUser">
                    Guest
                </span>


                <button
                    id="leaveButton"
                    class="leave-button"
                    type="button"
                >
                    Sign Out
                </button>

            </div>


        </header>



        <!-- =================================================
             MESSAGES
        ================================================== -->

        <main
            id="messages"
            class="messages"
            aria-live="polite"
        ></main>



        <!-- =================================================
             MESSAGE FORM
        ================================================== -->

        <form
            id="messageForm"
            class="message-form"
        >


            <div class="input-area">


                <div
                    id="codeIndicator"
                    class="code-indicator hidden"
                >
                    CODE MODE
                </div>


                <textarea
                    id="messageInput"
                    maxlength="10000"
                    placeholder="Login to send a message..."
                    autocomplete="off"
                    rows="1"
                    disabled
                ></textarea>


            </div>



            <!-- CODE -->

            <button
                type="button"
                id="codeButton"
                class="tool-button"
                disabled
            >
                &lt;/&gt; Code
            </button>



            <!-- SEND -->

            <button
                type="submit"
                id="sendButton"
                disabled
            >
                Send
            </button>


        </form>


    </section>



    <!-- =====================================================
         PDF.JS
    ====================================================== -->

    <script type="module">
    import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    window.pdfjsLib = pdfjsLib;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    window.dispatchEvent(
        new Event("pdfjs-ready")
    );
</script>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =====================================================
         LABCHAT JAVASCRIPT
    ====================================================== -->

    <script
        src="script.js"
    ></script>


</body>

</html>
