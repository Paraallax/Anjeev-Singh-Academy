<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LabChat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         PDF VIEWER
    ========================================== -->

    <div
        id="pdfApp"
        class="pdf-app"
    >


        <!-- PDF TOOLBAR -->

        <header class="pdf-toolbar">


            <div class="toolbar-left">

                <div class="brand">
                    <div class="brand-logo">
                        LC
                    </div>

                    <span>
                        LabChat
                    </span>
                </div>


                <div class="toolbar-divider"></div>


                <button
                    id="prevPage"
                    class="toolbar-button"
                    type="button"
                    title="Previous page"
                >
                    ‹
                </button>


                <div class="page-counter">

                    <input
                        id="pageNumber"
                        type="number"
                        min="1"
                        value="1"
                    >

                    <span>/</span>

                    <span id="pageCount">
                        0
                    </span>

                </div>


                <button
                    id="nextPage"
                    class="toolbar-button"
                    type="button"
                    title="Next page"
                >
                    ›
                </button>

            </div>


            <div class="toolbar-center">


                <button
                    id="zoomOut"
                    class="toolbar-button"
                    type="button"
                    title="Zoom out"
                >
                    −
                </button>


                <span
                    id="zoomLevel"
                    class="zoom-level"
                >
                    100%
                </span>


                <button
                    id="zoomIn"
                    class="toolbar-button"
                    type="button"
                    title="Zoom in"
                >
                    +
                </button>

            </div>


            <div class="toolbar-right">


                <button
                    id="openLoginButton"
                    class="login-toolbar-button"
                    type="button"
                >
                    Login
                </button>


                <button
                    id="fullscreenButton"
                    class="toolbar-button"
                    type="button"
                    title="Fullscreen"
                >
                    ⛶
                </button>

            </div>

        </header>



        <!-- PDF CONTENT -->

        <main
            id="pdfViewer"
            class="pdf-viewer"
        >

            <div
                id="pdfPages"
                class="pdf-pages"
            >
            </div>


            <div
                id="pdfLoading"
                class="pdf-loading"
            >

                <div class="loading-spinner"></div>

                <p>
                    Loading PDF...
                </p>

            </div>

        </main>

    </div>



    <!-- =========================================
         LOGIN OVERLAY
    ========================================== -->

    <div
        id="loginOverlay"
        class="login-overlay hidden"
    >


        <div
            id="loginModal"
            class="login-modal"
        >


            <button
                id="closeLoginButton"
                class="login-close"
                type="button"
                aria-label="Close login"
            >
                ×
            </button>


            <div class="login-logo">
                LC
            </div>


            <h1>
                LabChat Login
            </h1>


            <p class="login-subtitle">
                Sign in to continue
            </p>


            <form id="loginForm">


                <div class="login-field">

                    <label for="loginIdentifier">
                        Email / ID
                    </label>

                    <input
                        id="loginIdentifier"
                        type="text"
                        placeholder="Enter your email or ID"
                        autocomplete="username"
                    >

                </div>


                <div class="login-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                </div>


                <p
                    id="loginError"
                    class="login-error"
                ></p>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>


            </form>


            <p class="login-hint">

                Press
                <strong>Ctrl + Shift + L</strong>
                to open login.

            </p>


        </div>

    </div>



    <!-- =========================================
         PDF.JS
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"
    ></script>


    <script
        src="script.js"
        type="module"
    ></script>


</body>

</html>
